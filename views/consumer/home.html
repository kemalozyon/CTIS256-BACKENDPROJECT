<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse — SustainMart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar bg-white border-bottom px-3 py-2" data-nav></nav>

  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-3">
      <div>
        <h1 class="h3 mb-1">Browse deals near you</h1>
        <p class="text-muted small mb-0" id="locale-meta"></p>
      </div>
      <form class="d-flex gap-2" id="search-form" role="search">
        <input class="form-control" name="q" type="search" placeholder="Search products (e.g. mag)" autocomplete="off" />
        <button class="btn btn-brand">Search</button>
      </form>
    </div>

    <div id="results" class="row g-3">
      <div class="col-12 empty-state"><span class="spinner-inline"></span>Loading…</div>
    </div>

    <nav class="mt-4" aria-label="Pagination">
      <ul class="pagination justify-content-center" id="pager"></ul>
    </nav>
  </main>

  <script type="module" src="/js/consumer.js"></script>
</body>
</html>
