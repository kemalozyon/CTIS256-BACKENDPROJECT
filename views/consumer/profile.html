<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile — SustainMart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar bg-white border-bottom px-3 py-2" data-nav></nav>

  <main class="container my-4" style="max-width: 560px;">
    <h1 class="h3 mb-4">My profile</h1>

    <form id="profile-form" novalidate>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" name="email" type="email" disabled />
      </div>
      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input class="form-control" name="name" />
      </div>
      <div class="row g-2">
        <div class="col">
          <label class="form-label">City</label>
          <input class="form-control" name="city" />
        </div>
        <div class="col">
          <label class="form-label">District</label>
          <input class="form-control" name="district" />
        </div>
      </div>
      <button class="btn btn-brand mt-4" type="submit">Save changes</button>
    </form>
  </main>

  <script type="module" src="/js/profile.js" data-role="consumer"></script>
</body>
</html>
