<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — SustainMart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar bg-white border-bottom px-3 py-2" data-nav></nav>

  <main class="container my-5" style="max-width: 520px;">
    <h1 class="h3 mb-4">Log in</h1>

    <ul class="nav nav-pills mb-3" id="role-tabs" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-role="consumer">Consumer</button></li>
      <li class="nav-item"><button class="nav-link" data-role="market">Market</button></li>
    </ul>

    <form id="login-form" novalidate>
      <input type="hidden" name="role" value="consumer" />

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" name="email" type="email" autocomplete="email" />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" name="password" type="password" autocomplete="current-password" />
      </div>

      <button class="btn btn-brand w-100" type="submit">Log in</button>
      <p class="text-muted small mt-3 mb-0">
        No account yet? <a href="/register.html">Register here</a>.
      </p>
    </form>
  </main>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
