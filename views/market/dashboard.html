<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market dashboard — SustainMart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar bg-white border-bottom px-3 py-2" data-nav></nav>

  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h3 mb-0">My products</h1>
        <p class="text-muted small mb-0" id="market-meta"></p>
      </div>
      <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#product-modal" id="add-btn">Add product</button>
    </div>

    <div id="alert-expired" class="alert alert-danger d-none">
      <strong>Heads up:</strong> some products have expired. Expired rows are highlighted below.
    </div>

    <div class="table-responsive bg-white border rounded-3">
      <table class="table align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th style="width:64px"></th>
            <th>Title</th>
            <th>Stock</th>
            <th>Normal</th>
            <th>Discount</th>
            <th>Expiration</th>
            <th>Status</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="8" class="text-center text-muted py-5"><span class="spinner-inline"></span>Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Add/Edit modal -->
  <div class="modal fade" id="product-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="product-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="product-modal-title">Add product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id" />

          <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" name="title" />
          </div>

          <div class="row g-2">
            <div class="col">
              <label class="form-label">Stock</label>
              <input class="form-control" name="stock" type="number" min="0" step="1" />
            </div>
            <div class="col">
              <label class="form-label">Expiration</label>
              <input class="form-control" name="exp_date" type="date" />
            </div>
          </div>

          <div class="row g-2 mt-1">
            <div class="col">
              <label class="form-label">Normal price (TL)</label>
              <input class="form-control" name="normal_price" type="number" min="0" step="0.01" />
            </div>
            <div class="col">
              <label class="form-label">Discount price (TL)</label>
              <input class="form-control" name="discount_price" type="number" min="0" step="0.01" />
            </div>
          </div>

          <input type="hidden" name="image_url" />

          <div class="mt-3">
            <label class="form-label">Product image</label>
            <div id="img-preview-wrap" class="d-none mb-2 d-flex align-items-center gap-2">
              <img id="img-preview" src="" alt="" style="height:80px;width:80px;object-fit:cover;border-radius:.4rem;border:1px solid #dee2e6">
              <button type="button" class="btn btn-sm btn-outline-danger" id="remove-img">Remove</button>
            </div>
            <input class="form-control" name="image" type="file" accept="image/*" />
            <div class="form-text">Optional. Max 5 MB. A placeholder is shown if empty.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand" id="product-submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/market.js"></script>
</body>
</html>
