<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — SustainMart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar bg-white border-bottom px-3 py-2" data-nav></nav>

  <main class="container my-5" style="max-width: 560px;">
    <h1 class="h3 mb-4">Create an account</h1>

    <ul class="nav nav-pills mb-3" id="role-tabs" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-role="consumer">Consumer</button></li>
      <li class="nav-item"><button class="nav-link" data-role="market">Market</button></li>
    </ul>

    <form id="register-form" novalidate>
      <input type="hidden" name="role" value="consumer" />

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" name="email" type="email" autocomplete="email" />
      </div>

      <div class="mb-3">
        <label class="form-label" data-name-label>Full name</label>
        <input class="form-control" name="name" type="text" autocomplete="name" />
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" name="password" type="password" autocomplete="new-password" />
        <div class="form-text">At least 4 characters.</div>
      </div>

      <div class="row g-2">
        <div class="col">
          <label class="form-label">City</label>
          <input class="form-control" name="city" type="text" />
        </div>
        <div class="col">
          <label class="form-label">District</label>
          <input class="form-control" name="district" type="text" />
        </div>
      </div>

      <button class="btn btn-brand w-100 mt-4" type="submit">Create account</button>
      <p class="text-muted small mt-3 mb-0">
        Already have an account? <a href="/login.html">Log in</a>.
      </p>
    </form>

    <!-- Step 2: Email verification (hidden until registration succeeds) -->
    <div id="verify-section" class="d-none">
      <div class="alert alert-success mb-3">
        <strong>Account created!</strong> We sent a 6-digit code to
        <span id="verify-email-display" class="fw-semibold"></span>.
        Enter it below to activate your account.
      </div>
      <form id="verify-form" novalidate>
        <div class="mb-3">
          <label class="form-label">Verification code</label>
          <input class="form-control text-center" name="code" type="text"
                 maxlength="6" placeholder="123456"
                 autocomplete="one-time-code" inputmode="numeric"
                 style="letter-spacing:.5rem;font-size:1.4rem;font-weight:700;" />
          <div class="form-text">Check your inbox (and spam folder) for the 6-digit code.</div>
        </div>
        <button class="btn btn-brand w-100" type="submit">Verify email</button>
      </form>
      <p class="text-muted small mt-3 mb-0 text-center">
        Didn't receive it? <a href="#" id="resend-link">Resend code</a>
      </p>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
